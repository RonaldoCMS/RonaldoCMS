<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Fabio Danubbio, Full Stack Developer">
  <rect width="1200" height="340" rx="22" fill="#0b0e14"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#e8eaf0" stroke-opacity="0.12" stroke-width="2"/>

  <!-- puntini di sfondo -->
  <g fill="#e8eaf0" fill-opacity="0.08">
    <circle cx="640" cy="60" r="2"/><circle cx="670" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="640" cy="90" r="2"/><circle cx="670" cy="90" r="2"/><circle cx="700" cy="90" r="2"/>
    <circle cx="640" cy="120" r="2"/><circle cx="670" cy="120" r="2"/>
  </g>

  <!-- marchio _R -->
  <g transform="translate(60 62)">
    <rect width="104" height="104" rx="26" fill="#f5b942"/>
    <g transform="scale(1.625)">
      <path d="M30 15V49M30 15H43a10 10 0 0 1 0 20H30M41 35l11 14" fill="none" stroke="#1c1300" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="50" width="16" height="6" rx="3" fill="#1c1300"/>
    </g>
