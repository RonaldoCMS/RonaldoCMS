      <rect x="714" y="146" width="14" height="12" rx="2"/><rect x="734" y="146" width="14" height="12" rx="2"/><rect x="754" y="146" width="14" height="12" rx="2"/>
      <rect x="714" y="168" width="14" height="12" rx="2"/><rect x="734" y="168" width="14" height="12" rx="2"/><rect x="754" y="168" width="14" height="12" rx="2"/>
      <rect x="714" y="190" width="14" height="12" rx="2"/><rect x="734" y="190" width="14" height="12" rx="2"/><rect x="754" y="190" width="14" height="12" rx="2"/>
