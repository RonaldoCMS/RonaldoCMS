    <text x="196" y="110" font-size="58" font-weight="800" fill="#e8eaf0" letter-spacing="-1.5">Fabio Danubbio</text>
    <text x="198" y="152" font-size="24" font-weight="600" fill="#aab1c0">Full Stack Developer · Nola, Italia</text>
    <text x="60" y="238" font-size="30" font-weight="700" fill="#ffc961">Porto i prodotti dall’idea alla pubblicazione.</text>
    <text x="60" y="280" font-size="21" fill="#8a92a4" font-family="'Cascadia Code', Consolas, 'Courier New', monospace">app mobile · web · backend · dal cloud allo store</text>
  </g>

