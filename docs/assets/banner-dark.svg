    <path d="M740 110V78" stroke="#cbd2e0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="740" cy="76" r="4" fill="#ff5a4f"/>
    <rect x="704" y="108" width="72" height="150" fill="#34425f"/>
    <rect x="698" y="100" width="84" height="12" rx="3" fill="#3a4259"/>
    <g fill="#2a3550">
